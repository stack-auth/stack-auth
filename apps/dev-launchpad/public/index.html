<!DOCTYPE html>
<html>
  <head>
    <title>Hexclave Dev Launchpad</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script src="./env-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #2fa872;
        --accent-soft: rgba(47, 168, 114, 0.12);
        --bg: #e6eaf0;
        --shadow-dark: #c3c9d4;
        --shadow-light: #ffffff;
        --text: #3b4252;
        --text-dim: #7a8294;
        --text-faint: #a8aebc;
        --raised:
          7px 7px 14px var(--shadow-dark),
          -7px -7px 14px var(--shadow-light);
        --raised-lg:
          10px 10px 22px var(--shadow-dark),
          -10px -10px 22px var(--shadow-light);
        --inset:
          inset 4px 4px 8px var(--shadow-dark),
          inset -4px -4px 8px var(--shadow-light);
        --inset-soft:
          inset 2px 2px 5px var(--shadow-dark),
          inset -2px -2px 5px var(--shadow-light);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        background-color: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: 56px 44px 96px;
      }

      .mono { font-family: "JetBrains Mono", monospace; }

      /* ---------- header ---------- */

      header {
        margin-bottom: 64px;
        animation: rise 0.5s ease-out both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding: 8px 18px;
        border-radius: 999px;
        box-shadow: var(--inset-soft);
        margin-bottom: 26px;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
      }

      h1 {
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 900;
        line-height: 1.02;
        margin: 0 0 26px;
        letter-spacing: -0.02em;
        color: var(--text);
        text-shadow: 2px 2px 3px var(--shadow-dark), -2px -2px 3px var(--shadow-light);
      }

      h1 .soft { color: var(--accent); }

      .statusline {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12px;
        font-weight: 700;
      }

      .statusline > span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 999px;
        box-shadow: var(--raised);
        color: var(--text-dim);
      }

      .statusline b {
        color: var(--text);
        font-weight: 800;
      }

      .statusline .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .statusline .dot.warn {
        background: #d99a26;
        box-shadow: 0 0 8px #d99a26;
      }

      /* ---------- sections ---------- */

      section { margin-bottom: 64px; }

      .section-title {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 26px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .section-title .num {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--accent);
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        box-shadow: var(--inset-soft);
      }

      .section-title::after {
        content: "";
        flex: 1;
        height: 4px;
        border-radius: 999px;
        box-shadow: var(--inset-soft);
      }

      /* ---------- app cards ---------- */

      .apps-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(184px, 1fr));
        gap: 26px;
      }

      .apps-container > a {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
        min-height: 148px;
        background: var(--bg);
        border-radius: 22px;
        box-shadow: var(--raised);
        text-decoration: none;
        color: var(--text);
        transition: box-shadow 0.18s ease, transform 0.18s ease;
        animation: rise 0.5s ease-out both;
        animation-delay: var(--d, 0s);
      }

      .apps-container > a:hover {
        transform: translateY(-3px);
        box-shadow: var(--raised-lg);
        z-index: 10;
      }

      .apps-container > a:active {
        transform: translateY(0);
        box-shadow: var(--inset);
      }

      .apps-container > a .port {
        position: absolute;
        top: 14px;
        right: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-faint);
        padding: 4px 9px;
        border-radius: 999px;
        box-shadow: var(--inset-soft);
        transition: color 0.18s ease;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-faint);
        flex-shrink: 0;
        transition: background 0.3s ease, box-shadow 0.3s ease;
      }

      .status-dot.up {
        background: #2eb87c;
        box-shadow: 0 0 6px rgba(46, 184, 124, 0.8);
      }

      .status-dot.down { background: #d96673; }

      body.status-unavailable .status-dot { display: none; }

      .apps-container > a:hover .port { color: var(--accent); }

      .icon {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        box-shadow: var(--inset-soft);
        background: var(--accent-soft);
        flex-shrink: 0;
      }

      .icon i {
        display: block;
        width: 28px;
        height: 28px;
        background: var(--accent);
        -webkit-mask: var(--mask) center / contain no-repeat;
        mask: var(--mask) center / contain no-repeat;
      }

      .apps-container > a .name {
        font-size: 14px;
        font-weight: 800;
        line-height: 1.3;
        margin-top: auto;
      }

      /* tier 1: tooling — smaller, neutral icon wells */
      .apps-container.tier-1 { grid-template-columns: repeat(auto-fill, minmax(162px, 1fr)); gap: 22px; }
      .apps-container.tier-1 > a { min-height: 128px; padding: 18px; }
      .apps-container.tier-1 .icon { width: 46px; height: 46px; border-radius: 15px; background: transparent; }
      .apps-container.tier-1 .icon i { width: 23px; height: 23px; background: var(--text-dim); }
      .apps-container.tier-1 > a:hover .icon i { background: var(--accent); }
      .apps-container.tier-1 > a .name { font-size: 13px; }

      /* tier 0: examples — compact horizontal cards */
      .apps-container.tier-0 {
        grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
        gap: 18px;
      }

      .apps-container.tier-0 > a {
        flex-direction: row;
        align-items: center;
        min-height: 0;
        padding: 12px 16px;
        border-radius: 16px;
        gap: 12px;
        color: var(--text-dim);
      }

      .apps-container.tier-0 > a:hover { color: var(--text); }

      .apps-container.tier-0 .icon {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: transparent;
      }

      .apps-container.tier-0 .icon i {
        width: 19px;
        height: 19px;
        background: var(--text-dim);
      }

      .apps-container.tier-0 > a:hover .icon i { background: var(--accent); }
      .apps-container.tier-0 > a .name { margin-top: 0; font-size: 12.5px; font-weight: 700; }

      .apps-container.tier-0 > a .port {
        position: static;
        margin-left: auto;
        order: 10;
      }

      /* ---------- hover tooltip ---------- */

      .hover-description {
        display: none;
        position: absolute;
        top: calc(100% + 12px);
        left: 0;
        min-width: 100%;
        pointer-events: none;
        z-index: 1000;
        white-space: pre;
        background: var(--bg);
        border-radius: 14px;
        box-shadow: var(--raised-lg);
        padding: 12px 16px;
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        line-height: 1.8;
      }

      .hover-description::before {
        content: "▸ ";
        color: var(--accent);
      }

      .apps-container > a:hover .hover-description { display: block; }

      /* ---------- background services ---------- */

      .background-services {
        list-style: none;
        margin: 0;
        padding: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 12px;
        border-radius: 26px;
        box-shadow: var(--inset);
      }

      .background-services li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 16px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-dim);
        border-radius: 999px;
        transition: box-shadow 0.18s ease, color 0.18s ease;
      }

      .background-services li:hover {
        box-shadow: var(--raised);
        color: var(--text);
      }

      .background-services .bs-port {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 999px;
        box-shadow: var(--inset-soft);
        min-width: 86px;
        flex-shrink: 0;
      }

      footer {
        margin-top: 80px;
        display: inline-block;
        padding: 10px 22px;
        border-radius: 999px;
        box-shadow: var(--inset-soft);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="eyebrow">Hexclave · Local Environment</div>
        <h1>Dev <span class="soft">Launchpad</span></h1>
        <div class="statusline">
          <span><i class="dot js-health-dot"></i> <span class="js-systems">Checking services…</span></span>
          <span>Prefix&nbsp;<b class="js-prefix mono"></b></span>
          <span><b class="js-count mono"></b>&nbsp;services</span>
        </div>
      </header>

      <section>
        <div class="section-title"><span class="num">01</span> Primary</div>
        <div class="apps-container tier-2"></div>
      </section>

      <section>
        <div class="section-title"><span class="num">02</span> Tooling &amp; Infra</div>
        <div class="apps-container tier-1"></div>
      </section>

      <section>
        <div class="section-title"><span class="num">03</span> Examples &amp; Misc</div>
        <div class="apps-container tier-0"></div>
      </section>

      <section>
        <div class="section-title"><span class="num">04</span> Background Services</div>
        <ul class="background-services"></ul>
      </section>

      <footer>Hexclave dev launchpad — apps/dev-launchpad</footer>
    </div>

    <noscript>
      This page requires JavaScript.
    </noscript>
    <script>
      const derivePrefixFromLocation = () => {
        const port = window.location.port;
        if (!port || port.length < 2) return "81";
        return port.slice(0, -2);
      };
      const hexclavePortPrefix = window.NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX || derivePrefixFromLocation();
      window.NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX = hexclavePortPrefix;
      const withPrefix = (suffix) => `${hexclavePortPrefix}${suffix}`;

      // Depending on the port prefix, swap the accent: blue (91), amber (92), violet (93), green otherwise
      const accent = {
        "91": ["#4a90c2", "rgba(74, 144, 194, 0.12)"],
        "92": ["#d99a26", "rgba(217, 154, 38, 0.12)"],
        "93": ["#8b78d8", "rgba(139, 120, 216, 0.12)"],
      }[hexclavePortPrefix];
      if (accent) {
        document.documentElement.style.setProperty("--accent", accent[0]);
        document.documentElement.style.setProperty("--accent-soft", accent[1]);
      }

      const backgroundServices = [
        { suffix: "28", label: "PostgreSQL" },
        { suffix: "34", label: "PostgreSQL Replica (with replication lag)" },
        { suffix: "29", label: "Inbucket SMTP" },
        { suffix: "30", label: "Inbucket POP3" },
        { suffix: "31", label: "OTel collector" },
        { suffix: "21", label: "S3 mock" },
        { suffix: "22", label: "Freestyle mock" },
        { suffix: "23", label: "Stripe mock" },
        { suffix: "24", label: "LocalStack Gateway (AWS mock)" },
        { suffix: "25", label: "QStash mock" },
        { suffix: "37", label: "ClickHouse native interface" },
        { suffix: "39", label: "SpacetimeDB (MCP call log)" },
        { range: ["50", "99"], label: "Reserved for LocalStack (external services)" },
      ];

      const backgroundList = document.querySelector(".background-services");
      backgroundList.innerHTML = backgroundServices.map((service) => {
        const portText = service.range
          ? `${withPrefix(service.range[0])}-${withPrefix(service.range[1])}`
          : withPrefix(service.suffix);
        const dot = service.suffix ? `<i class="status-dot" data-port="${withPrefix(service.suffix)}"></i>` : "";
        return `<li><span class="bs-port">${dot}:${portText}</span>${service.label}</li>`;
      }).join("");

      // All icons live in ./icons/*.svg — monochrome, currentColor-based SVGs
      // rendered via CSS mask so they tint to the theme accent (and prefix variants).
      const apps = [
        {
          name: "Dashboard",
          portSuffix: "01",
          description: [
            "Src: ./apps/dashboard",
            "Prod: https://app.hexclave.com",

          icon: "dashboard",
          importance: 2,
        },
        {
          name: "Backend",
          portSuffix: "02",

            "Src: ./apps/backend",
            "Prod: https://api.hexclave.com",
          ],
          icon: "backend",
          importance: 2,
        },
        {
          name: "MCP",
          portSuffix: "44",
          description: [
            "Src: ./apps/mcp",
            "Prod: https://mcp.hexclave.com/mcp",
          ],
          icon: "mcp",
          importance: 2,
        },
        {

            "Prod: https://skill.hexclave.com",
          ],
          icon: "skills",

        },
        {
          name: "Demo app",

          description: [
            "Src: ./examples/demo",
            "Prod: https://demo.hexclave.com",
          ],
          icon: "demo",
          importance: 2,
        },
        {
          name: "Demo app — Local dev environment",
          portSuffix: "42",
          description: [
            "Src: ./examples/demo",
            "Prod: https://demo.hexclave.com",
          ],
          icon: "demo-local",
          importance: 2,
        },
        {
          name: "TanStack Start demo",
          portSuffix: "43",
          description: [
            "Src: ./examples/tanstack-start-demo",
            "Alpha SDK integration demo",
          ],
          icon: "tanstack",
          importance: 2,
        },
        {

          portSuffix: "26",
          description: [
            "Src: ./docs",
            "Prod: https://docs.hexclave.com",
          ],

          importance: 2,

        {

          portSuffix: "09",

        {

          ],

        {

          portSuffix: "41",

            "MCP call review tool",
          ],
          importance: 1,
          icon: "internal-tool",
        },
        {
          name: "Bulldozer Studio",
          portSuffix: "40",
          description: [
            "Bulldozer table graph and editor",
            "Includes raw storage debug browser",
          ],
          importance: 1,
          icon: "bulldozer",
        },
        {
          name: "JS example",
          portSuffix: "19",
          icon: "js",
          description: [
            "JavaScript example",
          ],
        },
        {
          name: "React example",
          portSuffix: "20",
          icon: "react",
          description: [
            "React example",
          ],
        },
        {
          name: "ClickHouse HTTP",
          portSuffix: "36",
          description: [
            "ClickHouse",
          ],
          importance: 1,
          icon: "clickhouse",
        },
        {
          name: "Convex example",
          portSuffix: "27",
          importance: 0,
          icon: "convex",
          description: [
            "Convex example",
          ],
        },
        {
          name: "Lovable React 18 example",
          portSuffix: "32",
          importance: 0,
          icon: "lovable",
          description: [
            "Lovable React 18 example",
          ],
        },
      ];

      document.querySelector(".js-prefix").textContent = `:${hexclavePortPrefix}xx`;
      document.querySelector(".js-count").textContent = apps.length + backgroundServices.length;

      const appsContainers = document.querySelectorAll(".apps-container");
      let cardIndex = 0;
      for (let i = 0; i < appsContainers.length; i++) {
        const appContainer = appsContainers[i];
        const importance = appsContainers.length - i - 1;
        for (const app of apps) {
          if ((app.importance ?? 0) === importance) {
            // TODO escape HTML
            appContainer.innerHTML += `
              <a href="http://${app.portSuffix === "42" ? "127.0.0.1" : (`${hexclavePortPrefix}` === "81" ? "localhost" : `p${hexclavePortPrefix}.localhost`)}:${withPrefix(app.portSuffix)}${app.path ?? ""}" target="_blank" rel="noopener noreferrer" style="--d: ${(cardIndex++ * 0.02).toFixed(3)}s">
                <div class="port"><i class="status-dot" data-port="${withPrefix(app.portSuffix)}"></i>:${withPrefix(app.portSuffix)}</div>
                <div class="icon"><i style="--mask: url('./icons/${app.icon}.svg')"></i></div>
                <span class="name">${app.name}</span>
                ${app.description ? `<div class="hover-description">${app.description.join("\n")}</div>` : ""}
              </a>
            `;
          }
        }
      }

      // Live status checks via the launchpad server's /api/status endpoint,
      // which TCP-probes each port (works for non-HTTP services like
      // PostgreSQL/SMTP). Degrades gracefully if the endpoint is missing.
      const statusPorts = [
        ...apps.map((app) => withPrefix(app.portSuffix)),
        ...backgroundServices.filter((s) => s.suffix).map((s) => withPrefix(s.suffix)),
      ];
      const refreshStatus = async () => {
        try {
          const res = await fetch(`/api/status?ports=${statusPorts.join(",")}`);
          if (!res.ok || !(res.headers.get("content-type") ?? "").includes("application/json")) {
            throw new Error("status endpoint unavailable");
          }
          const statusMap = await res.json();
          document.body.classList.remove("status-unavailable");
          document.querySelectorAll(".status-dot[data-port]").forEach((dot) => {
            const isUp = statusMap[dot.dataset.port];
            dot.classList.toggle("up", isUp === true);
            dot.classList.toggle("down", isUp === false);
          });
          const upCount = statusPorts.filter((p) => statusMap[p]).length;
          const allUp = upCount === statusPorts.length;
          document.querySelector(".js-systems").textContent = allUp
            ? "All systems nominal"
            : `${upCount}/${statusPorts.length} services up`;
          document.querySelector(".js-health-dot").classList.toggle("warn", !allUp);
        } catch {
          document.body.classList.add("status-unavailable");
          document.querySelector(".js-systems").textContent = "All systems nominal";
        }
      };
      refreshStatus();
      setInterval(refreshStatus, 15000);
    </script>
  </body>
</html>
