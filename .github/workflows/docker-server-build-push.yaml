name: Docker Server Build and Push

# Publishes to GHCR rather than Docker Hub.
#
# Upstream's version of this workflow pushes to Docker Hub using DOCKER_REPO,
# DOCKER_USER and DOCKER_PASSWORD. A fork does not inherit repository secrets, so that
# login step fails within seconds and no image is ever published. GHCR authenticates with
# the GITHUB_TOKEN that Actions already provides, so this works on a fresh fork with
# nothing configured.
#
# An image has to be built here because Railway cannot build docker/server/Dockerfile
# itself: Railway requires BuildKit cache mount ids prefixed with `s/<service id>-`, and
# explicitly forbids supplying that through an environment variable, so a shared Dockerfile
# cannot satisfy it without hardcoding one project's service id.
on:
  push:
    branches:
      - main
      - dev
  # Lets a feature branch publish an image without merging first, which is how a change is
  # tested on Railway before it lands.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-push:
    name: Build and push server image
    runs-on: ubuntu-latest
    # A full monorepo build (turbo prune, backend bundle, Next.js dashboard) takes far
    # longer on a GitHub-hosted runner than on the 8-core machines upstream builds with.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # GHCR rejects uppercase path segments, and repository owners commonly have them.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/server" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: Railway runs x86_64, and emulating a second platform would roughly
      # double an already-long build for something this fork never deploys to. The layer
      # cache lives in the Actions cache because the Dockerfile's own cache mounts are not
      # usable here.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
