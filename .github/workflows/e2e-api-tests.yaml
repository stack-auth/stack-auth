name: Runs E2E API Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

# A concurrency group only ever runs one run at a time, so the sha is part of the group on main/dev:
# otherwise consecutive dev pushes queue behind each other (and GitHub cancels the older queued run),
# so one slow or hung run silently skips CI for every commit after it. PRs and feature branches stay
# grouped per ref, where cancelling superseded runs is what we want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  wait-for-fast-fail:
    name: wait-for-fast-fail
    # Temporary diagnostic-PR exception: collect backend route spans even when
    # the unrelated fast-fail suite has a flaky E2E failure.
    continue-on-error: ${{ github.head_ref == 'devin/1786345250-backend-span-diagnostics' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/wait-for-check
        with:
          workflow-file: fast-fail-tests.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    timeout-minutes: 150
    needs: wait-for-fast-fail
    name: E2E Tests (Node ${{ matrix.node-version }}, Freestyle ${{ matrix.freestyle-mode }})
    runs-on: ubicloud-standard-8
    env:
      NODE_ENV: test
      HEXCLAVE_ENABLE_HARDCODED_PASSKEY_CHALLENGE_FOR_TESTING: yes
      HEXCLAVE_DATABASE_CONNECTION_STRING: "postgres://postgres:PASSWORD-PLACEHOLDER--uqfEC1hmmv@localhost:8128/stackframe"
      HEXCLAVE_EXTERNAL_DB_SYNC_MAX_DURATION_MS: "20000"
      HEXCLAVE_EXTERNAL_DB_SYNC_DIRECT: "false"

    strategy:
      # Keep the mock arm alive when the comparable prod arm times out. The
      # diagnostic dataset comes from mock, and matrix cancellation would discard
      # its later snapshots.
      fail-fast: false
      matrix:
        node-version: [22.x]
        freestyle-mode: [mock, prod]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Even just starting the Docker Compose as a daemon is slow because we have to download and build the images
      # so, we run it in the background
      - name: Start Docker Compose in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: docker compose -f docker/dependencies/docker.compose.yaml up --pull always -d &
          # we don't need to wait on anything, just need to start the daemon
          wait-on: /dev/null
          tail: true
          wait-for: 3s
          log-output-if: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.test.local file for apps/backend
        run: cp apps/backend/.env.development apps/backend/.env.test.local

      - name: Override Freestyle API key for prod mode
        if: matrix.freestyle-mode == 'prod'
        run: |
          echo "HEXCLAVE_FREESTYLE_API_KEY=${{ secrets.STACK_FREESTYLE_REAL_API_KEY }}" >> apps/backend/.env.test.local

      - name: Create .env.test.local file for apps/dashboard
        run: cp apps/dashboard/.env.development apps/dashboard/.env.test.local
      
      - name: Create .env.test.local file for apps/e2e
        run: cp apps/e2e/.env.development apps/e2e/.env.test.local

      - name: Create .env.test.local file for examples/cjs-test
        run: cp examples/cjs-test/.env.development examples/cjs-test/.env.test.local
      
      - name: Create .env.test.local file for examples/demo
        run: cp examples/demo/.env.development examples/demo/.env.test.local

      - name: Create .env.test.local file for examples/docs-examples
        run: cp examples/docs-examples/.env.development examples/docs-examples/.env.test.local

      - name: Create .env.test.local file for examples/e-commerce
        run: cp examples/e-commerce/.env.development examples/e-commerce/.env.test.local

      - name: Create .env.test.local file for examples/middleware
        run: cp examples/middleware/.env.development examples/middleware/.env.test.local

      - name: Create .env.test.local file for examples/supabase
        run: cp examples/supabase/.env.development examples/supabase/.env.test.local

      - name: Create .env.test.local file for examples/convex
        run: cp examples/convex/.env.development examples/convex/.env.test.local

      - name: Create .env.test.local file for apps/internal-tool
        run: cp apps/internal-tool/.env.development apps/internal-tool/.env.test.local

      - name: Build
        run: pnpm build

      - name: Wait on Postgres
        run: pnpm run wait-until-postgres-is-ready:pg_isready

      - name: Wait on Inbucket
        run: pnpm exec wait-on tcp:localhost:8129

      - name: Wait on Svix
        run: pnpm exec wait-on tcp:localhost:8113
      
      - name: Wait on QStash
        run: pnpm exec wait-on tcp:localhost:8125

      - name: Wait on ClickHouse
        run: pnpm exec wait-on http://localhost:8136/ping

      - name: Initialize database
        run: pnpm run db:init
  
      - name: Start bulldozer-js in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        env:
          HEXCLAVE_BULLDOZER_JS_USE_TMP_LMDB: "1"
        with:
          run: |
            bulldozer_log="$RUNNER_TEMP/hexclave-bulldozer.untracked.log"
            (
              set +e
              # Keep service output correlatable with the surrounding GitHub Actions logs.
              pnpm run start:bulldozer 2>&1 | TZ=UTC awk '{ print strftime("%Y-%m-%dT%H:%M:%SZ"), $0; fflush() }' >"$bulldozer_log"
              echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/hexclave-bulldozer-exit-code.untracked.txt"
            ) &
          wait-on: |
            tcp:localhost:8146
          tail: true
          wait-for: 30s
          log-output-if: true

      # db:init only seeds Postgres now; mirror the seeded payment rows into the
      # fresh bulldozer-js store so the backend's payment reads aren't empty.
      - name: Backfill Bulldozer from Postgres
        run: pnpm run db:backfill-bulldozer-from-prisma

      # The built server (node dist/server.mjs) does not auto-load .env files the way
      # `next start` used to, so it must be wrapped in with-env:test to pick up
      # .env.test.local (mirrors the e2e-fallback-tests workflow).
      - name: Start stack-backend in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        env:
          # Profile-only mode deliberately leaves span aggregation and forced
          # trace sampling disabled, so the profile measures the real backend.
          HEXCLAVE_CPU_PROFILING: "true"
        with:
          run: pnpm -C apps/backend run with-env:test pnpm run start &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start stack-mcp in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm run start:mcp --log-order=stream &
          wait-on: |
            http://localhost:8144/health
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start stack-dashboard in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm run start:dashboard --log-order=stream &
          wait-on: |
            http://localhost:8101
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start mock-oauth-server in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm run start:mock-oauth-server --log-order=stream &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start run-email-queue in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm -C apps/backend run run-email-queue --log-order=stream &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start run-cron-jobs in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm -C apps/backend run run-cron-jobs:test --log-order=stream &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true

      - name: Wait 10 seconds
        run: sleep 10

      - name: Reset backend span and process attribution
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh reset || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if ! curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?reset=true" >/dev/null
              then
                echo "Span aggregation reset failed (backend port ${backend_port})." >&2
              fi
            '

      - name: Reset PostgreSQL statement attribution
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh reset

      # Temporary diagnostic-PR smoke check: prove the built backend emits a route span
      # before spending a full test pass on the request-path attribution. This is
      # diagnostic evidence only; do not gate the workload on it.
      - name: Smoke-test backend route span
        if: github.head_ref == 'devin/1786345250-backend-span-diagnostics'
        continue-on-error: true
        run: |
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if ! curl --fail-with-body --silent --show-error \
                "http://localhost:${backend_port}/api/latest/internal/component-versions" >/dev/null
              then
                echo "Backend route smoke request failed (backend port ${backend_port})." >&2
              fi
              if response="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?reset=true")"
              then
                printf "%s\n" "$response" | jq .
                if ! printf "%s\n" "$response" | jq -e \
                  "[.spans[] | select(.name | startswith(\"STACK: GET \"))] | length > 0" \
                  >/dev/null
                then
                  echo "Backend route span smoke snapshot contained no GET route span." >&2
                  exit 1
                fi
              else
                echo "Backend route span smoke snapshot failed (backend port ${backend_port})." >&2
                exit 1
              fi
            '

      - name: Start backend CPU profile for pass 1
        if: github.head_ref == 'devin/1786345250-backend-span-diagnostics'
        continue-on-error: true
        run: |
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if ! curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?profile=start" \
                >/dev/null
              then
                echo "Backend CPU profile start failed (backend port ${backend_port})." >&2
              fi
            '

      # Temporary diagnostic-PR exception: keep collecting both pass snapshots when
      # the known flaky E2E suite failure occurs; the test failure remains visible.
      - name: Run tests
        id: run_tests_pass1
        continue-on-error: ${{ github.head_ref == 'devin/1786345250-backend-span-diagnostics' }}
        timeout-minutes: 60
        run: pnpm test run ${{ matrix.freestyle-mode == 'prod' && '--min-workers=1 --max-workers=1' || '' }}

      - name: Snapshot PostgreSQL attribution after pass 1
        if: always()
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh snapshot

      - name: Snapshot backend span and process attribution after pass 1
        if: always()
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh snapshot || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if response="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?profile=stop&reset=true")"
              then
                printf "%s\n" "$response" | jq -r '\''.cpuProfile // empty'\'' > "$RUNNER_TEMP/backend-cpu-profile-pass1.untracked.json"
                printf "%s\n" "$response" | jq '\''del(.cpuProfile)'\''
              else
                echo "Span aggregation snapshot failed (backend port ${backend_port})." >&2
              fi
            '

      - name: Start backend CPU profile for pass 2
        if: github.head_ref == 'devin/1786345250-backend-span-diagnostics'
        continue-on-error: true
        run: |
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if ! curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?profile=start" \
                >/dev/null
              then
                echo "Backend CPU profile start failed (backend port ${backend_port})." >&2
              fi
            '

      # Temporary diagnostic-PR exception: keep the repeat passes enabled on this branch
      # so the span and process snapshots can be compared before this change merges.
      - name: Run tests again (attempt 1)
        id: run_tests_pass2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.head_ref == 'devin/1786345250-backend-span-diagnostics'
        timeout-minutes: 75
        run: pnpm test run ${{ matrix.freestyle-mode == 'prod' && '--min-workers=1 --max-workers=1' || '' }}

      - name: Snapshot PostgreSQL attribution after pass 2
        if: always() && steps.run_tests_pass2.outcome != 'skipped'
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh snapshot

      - name: Snapshot backend span and process attribution after pass 2
        if: always() && steps.run_tests_pass2.outcome != 'skipped'
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh snapshot || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if response="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?profile=stop&reset=true")"
              then
                printf "%s\n" "$response" | jq -r '\''.cpuProfile // empty'\'' > "$RUNNER_TEMP/backend-cpu-profile-pass2.untracked.json"
                printf "%s\n" "$response" | jq '\''del(.cpuProfile)'\''
              else
                echo "Span aggregation snapshot failed (backend port ${backend_port})." >&2
              fi
            '

      - name: Run tests again (attempt 2)
        id: run_tests_pass3
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.head_ref == 'devin/1786345250-backend-span-diagnostics') && steps.run_tests_pass2.outcome == 'success'
        timeout-minutes: 105
        run: pnpm test run ${{ matrix.freestyle-mode == 'prod' && '--min-workers=1 --max-workers=1' || '' }}

      - name: Snapshot PostgreSQL attribution after pass 3
        if: always() && steps.run_tests_pass3.outcome != 'skipped'
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh snapshot

      - name: Snapshot backend span and process attribution after pass 3
        if: always() && steps.run_tests_pass3.outcome != 'skipped'
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh snapshot || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              backend_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}02"
              if response="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CRON_SECRET" \
                "http://localhost:${backend_port}/api/latest/internal/span-aggregation?reset=true")"
              then
                printf "%s\n" "$response" | jq .
              else
                echo "Span aggregation snapshot failed (backend port ${backend_port})." >&2
              fi
            '

      - name: Run perf tests
        if: matrix.freestyle-mode == 'mock'
        env:
          HEXCLAVE_RUN_PERF_TESTS: "1"
        run: pnpm test run --min-workers=1 --max-workers=1 .perf.test

      - name: Verify data integrity
        run: pnpm run verify-data-integrity --no-bail

      - name: Print bulldozer-js diagnostics
        if: ${{ failure() }}
        run: |
          if [[ -f "$RUNNER_TEMP/hexclave-bulldozer-exit-code.untracked.txt" ]]; then
            echo "Bulldozer-js command exited with code $(<"$RUNNER_TEMP/hexclave-bulldozer-exit-code.untracked.txt")"
          else
            echo "Bulldozer-js command is still running; a child process may have exited"
          fi
          tail -n 2000 "$RUNNER_TEMP/hexclave-bulldozer.untracked.log"

      - name: Upload bulldozer-js logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-api-bulldozer-${{ matrix.freestyle-mode }}
          path: ${{ runner.temp }}/hexclave-bulldozer.untracked.log
          if-no-files-found: error

      - name: Print Docker Compose logs
        if: always()
        run: docker compose -f docker/dependencies/docker.compose.yaml logs

      - name: Upload backend CPU profiles
        if: always() && github.head_ref == 'devin/1786345250-backend-span-diagnostics'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-api-backend-cpu-profiles-${{ matrix.freestyle-mode }}
          path: ${{ runner.temp }}/backend-cpu-profile-*.untracked.json
          if-no-files-found: ignore
